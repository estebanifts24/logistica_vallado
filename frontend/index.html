<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logística Vallado</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>


<!-- 🔐 LOGIN VIEW -->
<div id="loginView" class="login-container">

  <div class="login-box">

    <h1 class="login-title">
      Logística Vallado
    </h1>

    <p class="login-subtitle">
      Sistema Integral de Gestión Logística
    </p>

    <h2>Iniciar sesión</h2>

    <input id="email" placeholder="Email">

    <input
      id="password"
      type="password"
      placeholder="Contraseña"
    >

    <button id="btnLogin">
      Login
    </button>

    <div class="login-footer">
      Logística Vallado

      v1.0 <br>

      © 2026
    </div>

  </div>

</div>



<!-- 📊 DASHBOARD APP -->
<div id="app" style="display:none;">

  <div class="container">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">

      <h2 id="btnDashboard"> 📊 Dashboard</h2>

      <button id="btnUsuarios" class="menu-btn">
        <span class="menu-icon">👤</span>
        <span class="menu-text">Usuarios</span>
      </button>

      <button id="btnCamiones" class="menu-btn">
        <span class="menu-icon">🚚</span>
        <span class="menu-text">Camiones</span>
      </button>

      <button id="btnVallas" class="menu-btn">
        <span class="menu-icon">🚧</span>
        <span class="menu-text">Vallas</span>
      </button>

      <button id="btnEmpleados" class="menu-btn">
        <span class="menu-icon">👷</span>
        <span class="menu-text">Empleados</span>
      </button>

      <button id="btnMovimientos" class="menu-btn">
        <span class="menu-icon">📋</span>
        <span class="menu-text">Movimientos</span>
      </button>

      <button id="btnStock" class="menu-btn">
        <span class="menu-icon">📦</span>
        <span class="menu-text">Stock</span>
      </button>

      <button id="btnUbicaciones" class="menu-btn">
        <span class="menu-icon">📍</span>
        <span class="menu-text">Ubicaciones</span>
      </button>
      
      <hr>

     <button class="menu-btn logout">
        <span class="menu-icon">🚪</span>
        <span class="menu-text">Logout</span>
     </button>

    </aside>

    <!-- PANEL PRINCIPAL -->
   <main class="panel">

  <div class="app-header">

  <div class="app-title">

    <h1>Gestión Logística Vallas</h1>

    <p class="app-subtitle">
      Sistema Integral de Administración
    </p>

  </div>

  <div id="userInfo"></div>

</div>

  <!-- AQUÍ SE RENDERIZA TODO -->
  <div id="content" class="content-box">
      </div>

    </main>

  </div>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
